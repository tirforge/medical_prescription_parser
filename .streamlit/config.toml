# Medical theme: deep teal — single accent across config + CSS (was blue #0066CC, now unified).
[theme]
base = "light"
primaryColor = "#0C6B64"
font = "sans serif"
showWidgetBorder = true

[theme.light]
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F1F4F7"
textColor = "#2C3E50"

[theme.dark]
backgroundColor = "#0E1513"
secondaryBackgroundColor = "#16211E"
textColor = "#E8F3F0"
primaryColor = "#3EC1BE"
