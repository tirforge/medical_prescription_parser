# Medical theme: clinical blue-gray — most trusted for healthcare (awesome-streamlit-themes: Healthcare)
# + IBM Plex-style radius, widget borders; teal fallback in dark mode.
[theme]
base = "light"
primaryColor = "#0066CC"
font = "sans serif"
showWidgetBorder = true

[theme.light]
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F1F4F7"
textColor = "#2C3E50"

[theme.dark]
backgroundColor = "#0E1513"
secondaryBackgroundColor = "#16211E"
textColor = "#E8F3F0"
primaryColor = "#3EC1BE"
